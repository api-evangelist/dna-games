name: DNA Games
description: 'DNA Games was a social game studio founded in 2009 by Jon Lee and Shaun
  Haase in the San Francisco Bay Area, building technology for real-time social game
  optimization on the Facebook platform. The studio shipped Casino City, Bar World,
  and Slot City, casino and lifestyle simulation titles that together reached more
  than 20 million players, with Casino City becoming a leading casino simulation game
  on Facebook. The company raised roughly $2 million in venture funding from Battery
  Ventures and Bain Capital Ventures before being acquired by Zynga in May 2011, one
  of a rapid series of Zynga studio acquisitions during that period. Post-acquisition
  the founders and core team were absorbed into Zynga to seed a new internal game
  studio, and DNA Games ceased to operate as an independent company. As of the July
  2026 enrichment pass the company publishes no website, developer portal, documentation,
  or public API surface; the dnagames.com, dna.games, and dnagames.io domains are
  all parked or listed for sale by third parties and are not operated by the company.'
